apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: koperasi
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - postgres-init-configmap.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - auth-service/deployment.yaml
  - auth-service/service.yaml
  - loan-service/deployment.yaml
  - loan-service/service.yaml
  - scoring-service/deployment.yaml
  - scoring-service/service.yaml
  - payment-service/deployment.yaml
  - payment-service/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ingress.yaml
  - hpa.yaml
  - prometheus-configmap.yaml
  - grafana-dashboards-configmap.yaml
  - grafana-datasource-configmap.yaml
  - monitoring.yaml
images:
  - name: ghcr.io/koperasi-digital/koperasi-auth-service
    newTag: latest
  - name: ghcr.io/koperasi-digital/koperasi-loan-service
    newTag: latest
  - name: ghcr.io/koperasi-digital/koperasi-scoring-service
    newTag: latest
  - name: ghcr.io/koperasi-digital/koperasi-payment-service
    newTag: latest
  - name: ghcr.io/koperasi-digital/koperasi-frontend
    newTag: latest
