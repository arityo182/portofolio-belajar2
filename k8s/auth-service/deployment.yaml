apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: koperasi
  labels:
    app: auth-service
    app.kubernetes.io/part-of: koperasi-digital
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: koperasi-digital
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: ghcr.io/koperasi-digital/koperasi-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: koperasi-config
            - secretRef:
                name: koperasi-secrets
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/koperasi?currentSchema=auth_schema"
            - name: DB_USERNAME
              value: "auth_user"
            - name: DB_SCHEMA
              value: "auth_schema"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: koperasi-secrets
                  key: AUTH_DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 70
            periodSeconds: 20
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
