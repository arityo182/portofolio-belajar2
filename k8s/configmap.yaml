apiVersion: v1
kind: ConfigMap
metadata:
  name: koperasi-config
  namespace: koperasi
  labels:
    app.kubernetes.io/part-of: koperasi-digital
data:
  TZ: Asia/Jakarta
  SPRING_PROFILES_ACTIVE: kubernetes
  LOG_LEVEL: INFO
  LOG_LEVEL_APP: INFO
  JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Jakarta"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: koperasi
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_PATTERN: "^(loan\\.application\\..*|loan\\.status\\.changed|loan\\.defaulted|payment\\..*|notification\\.send\\.requested)$"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: koperasi
  RABBITMQ_VHOST: "/"
  JWT_ISSUER: koperasi-auth
  JWT_ACCESS_TOKEN_TTL: "900"
  JWT_REFRESH_TOKEN_TTL: "604800"
  BCRYPT_COST_FACTOR: "12"
  CORS_ALLOWED_ORIGINS: https://koperasi.example.com
  WEBSOCKET_ALLOWED_ORIGINS: https://koperasi.example.com
  ROUTE_AUTH_URI: http://auth-service:8081
  ROUTE_LOAN_URI: http://loan-service:8082
  ROUTE_SCORING_URI: http://scoring-service:8083
  ROUTE_PAYMENT_URI: http://payment-service:8084
  LOAN_SERVICE_URL: http://loan-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8084
  SCORING_SERVICE_URL: http://scoring-service:8083
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  KAFKA_AUDIT_TOPIC: audit.event.created
  AUDIT_KAFKA_ENABLED: "true"
  NOTIFICATION_REDIS_FANOUT: "true"
  NOTIFICATION_FANOUT_CHANNEL: notifications:fanout
  REPORT_DB_URL: jdbc:postgresql://postgres:5432/koperasi?currentSchema=public
  REPORT_DB_USERNAME: report_user
  NOTIFICATION_SSE_HEARTBEAT_MS: "30000"
  NOTIFICATION_SSE_TIMEOUT_MS: "1800000"
  NOTIFICATION_MAX_PAGE_SIZE: "100"
  LOAN_INSTALLMENT_METHOD: FLAT
  LOAN_DEFAULT_OVERDUE_DAYS: "90"
  SCORING_KAFKA_ENABLED: "true"
  SCORING_CALLBACK_ENABLED: "true"
  CALLBACK_TIMEOUT_SECONDS: "5"
  CALLBACK_MAX_RETRIES: "2"
  SCORING_CALLBACK_PATH: /api/v1/loans/internal/scoring/completed
  KAFKA_TOPIC_SCORING_REQUESTED: loan.scoring.requested
  KAFKA_TOPIC_SCORING_COMPLETED: loan.scoring.completed
  KAFKA_GROUP_ID: scoring-service-group
  ML_MODEL_PATH: /app/models/credit_model_v1.0.0.h5
  ML_SCALER_PATH: /app/models/scaler.pkl
  ML_ENCODER_PATH: /app/models/encoder.pkl
  ML_METADATA_PATH: /app/models/model_metadata.json
  MODEL_VERSION: v1.0.0
  MODEL_TRAINED_AT: "2026-10-01T00:00:00Z"
  CANARY_TRAFFIC_PCT: "0"
  NEXT_PUBLIC_API_BASE_URL: /api/v1
  NEXT_PUBLIC_WS_URL: wss://koperasi.example.com/ws
  NEXT_PUBLIC_ENV: production
