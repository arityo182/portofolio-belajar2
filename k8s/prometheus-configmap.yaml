apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: koperasi
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: auth-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["auth-service:8081"]

      - job_name: core-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["loan-service:8082"]

      - job_name: scoring-service
        metrics_path: /metrics
        static_configs:
          - targets: ["scoring-service:8083"]

      - job_name: payment-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["payment-service:8084"]

  alert-rules.yml: |
    groups:
      - name: koperasi-availability
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.job }} tidak tersedia"
              description: "Prometheus tidak dapat melakukan scrape ke {{ $labels.instance }} selama 2 menit."
          - alert: HighHttpErrorRate
            expr: |
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job)
              /
              clamp_min(sum(rate(http_server_requests_seconds_count[5m])) by (job), 0.001)
              > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Tingkat error 5xx tinggi pada {{ $labels.job }}"
              description: "Rasio respons 5xx melebihi 5% selama 5 menit."
          - alert: HighLatencyP95
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)
              ) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Latensi p95 tinggi pada {{ $labels.job }}"
              description: "Latensi p95 melebihi 1 detik selama 5 menit."
          - alert: JvmHeapPressure
            expr: |
              sum(jvm_memory_used_bytes{area="heap"}) by (job)
              /
              clamp_min(sum(jvm_memory_max_bytes{area="heap"}) by (job), 1)
              > 0.9
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Tekanan heap JVM tinggi pada {{ $labels.job }}"
              description: "Penggunaan heap melebihi 90% selama 10 menit."
      - name: koperasi-business
        rules:
          - alert: NoDisbursementToday
            expr: increase(koperasi_loan_disbursed_total[24h]) == 0
            for: 1h
            labels:
              severity: info
            annotations:
              summary: "Tidak ada pencairan dalam 24 jam terakhir"
