name: Build and Push Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - name: loan-service
            context: .
            dockerfile: services/loan-service/Dockerfile
          - name: scoring-service
            context: .
            dockerfile: services/scoring-service/Dockerfile
          - name: payment-service
            context: .
            dockerfile: services/payment-service/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - name: nginx
            context: .
            dockerfile: nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/koperasi-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.name }}
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_WS_URL=wss://koperasi.example.com/ws
            NEXT_PUBLIC_ENV=production
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
