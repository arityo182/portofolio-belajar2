server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  servlet:
    multipart:
      max-file-size: ${PROFILE_MAX_FILE_SIZE:5MB}
      max-request-size: ${PROFILE_MAX_REQUEST_SIZE:12MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/koperasi?currentSchema=auth_schema}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      pool-name: auth-service-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: ${DB_SCHEMA:auth_schema}
        format_sql: false
        generate_statistics: false
    show-sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:auth_schema}
    default-schema: ${DB_SCHEMA:auth_schema}
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_IDEMPOTENCE:true}
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:30000}
        spring.json.add.type.headers: false
    template:
      default-topic: ${KAFKA_AUDIT_TOPIC:audit.event.created}

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL:900}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL:604800}
  issuer: ${JWT_ISSUER:koperasi-auth}

app:
  security:
    bcrypt-cost: ${BCRYPT_COST_FACTOR:12}
  pii:
    key: ${PII_ENCRYPTION_KEY:}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    log-link: ${PASSWORD_RESET_LOG_LINK:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  audit:
    enabled: ${AUDIT_KAFKA_ENABLED:true}
    topic: ${KAFKA_AUDIT_TOPIC:audit.event.created}
    service-name: auth-service

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
      show-details: when_authorized
  health:
    rabbit:
      enabled: ${RABBITMQ_HEALTH_ENABLED:false}
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: auth-service

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.koperasi.auth: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [traceId=%X{traceId:-}] [userId=%X{userId:-}] [serviceId=%X{serviceId:-}] %logger{36} - %msg%n"

