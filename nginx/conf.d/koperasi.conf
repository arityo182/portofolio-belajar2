    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api/v1/notifications/stream {
            proxy_pass http://core_service;
            include /etc/nginx/proxy_params_stream.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_login burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location = /api/v1/auth/register {
            limit_req zone=auth_register burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        # Internal service-to-service endpoints must never be reachable from the internet.
        location ^~ /api/v1/loans/internal/ {
            access_log off;
            return 404;
        }

        location /api/v1/auth {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location /api/v1/admin/users {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location /api/v1/borrowers {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://auth_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location /api/v1/loans {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://core_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location /api/v1/notifications {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://core_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location /api/v1/reports {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://core_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location /api/v1/payments {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://payment_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location /api/v1/scoring {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://scoring_service;
            include /etc/nginx/proxy_params_koperasi.conf;
        }

        location /ws {
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend_app;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
            proxy_read_timeout 60s;
        }
    }
